services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aiki
      POSTGRES_USER: aiki
      POSTGRES_PASSWORD: aiki
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiki -d aiki"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
