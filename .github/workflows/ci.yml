name: CI

# Manual only, for now, and not because that is better.
#
# Every run fails in about three seconds with "The job was not started because
# your account is locked due to a billing issue", and the card that would clear
# it keeps being rejected. On push this produced a permanently red badge on main,
# which this project has already decided once is worse than no CI: a badge that
# is always red is a badge nobody reads, and it hides the run that genuinely
# fails later.
#
# The workflow is correct and kept ready. When billing clears, put the push and
# pull_request triggers back and this starts working with no other change. Until
# then it can be run by hand with `gh workflow run ci.yml`, which fails for the
# same reason but does not mark the branch.
on:
  workflow_dispatch:

# A second push supersedes the first. Nobody needs the results for a commit that
# has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AiKi

    services:
      # The SQL is the only thing these tests cannot check without a database,
      # and it is the part most worth checking: nine tests skip silently without
      # DATABASE_URL, and they are the ones guarding the queries.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aiki
          POSTGRES_PASSWORD: aiki
          POSTGRES_DB: aiki
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: AiKi/.nvmrc
          cache: pnpm
          cache-dependency-path: AiKi/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - uses: foundry-rs/foundry-toolchain@v1

      # Two of the chain tests deploy from different anvil accounts on purpose,
      # because sharing a deployer made their nonces race under vitest's
      # parallelism and one silently skipped. They skip entirely without a node.
      - name: Start anvil
        run: anvil --port 8545 &

      - name: API tests
        run: pnpm --filter @aiki/api test
        env:
          DATABASE_URL: postgres://aiki:aiki@127.0.0.1:5432/aiki

      # Includes the fork tests, which reach a public BSC archive endpoint and
      # redeem through MetaMask's deployed manager. If they start failing here
      # for rate limits rather than for code, point foundry.toml at a keyed RPC
      # rather than deleting the tests.
      - name: Contract tests
        run: forge test
        working-directory: AiKi/onchain

      - name: Web build
        run: pnpm --filter @aiki/web build
