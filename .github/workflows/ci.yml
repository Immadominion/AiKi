name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AiKi
    # The persistence tests are the ones that catch a broken cap under
    # concurrency, so CI gets a real database rather than skipping them.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aiki
          POSTGRES_USER: aiki
          POSTGRES_PASSWORD: aiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiki -d aiki"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://aiki:aiki@127.0.0.1:5432/aiki
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: AiKi/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: AiKi/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Migrate
        run: pnpm --filter @aiki/api db:migrate

      - name: Test
        run: pnpm --filter @aiki/api test

      - name: Build web
        run: pnpm --filter @aiki/web build
