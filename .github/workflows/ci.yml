name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AiKi

    # The tests that catch a broken cap under concurrency need a real database,
    # and the ones that prove an agent can actually move money need a real chain.
    # Both are cheap here and skipping them is how a green run stops meaning
    # anything.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aiki
          POSTGRES_USER: aiki
          POSTGRES_PASSWORD: aiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiki -d aiki"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://aiki:aiki@127.0.0.1:5432/aiki

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: AiKi/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: AiKi/pnpm-lock.yaml

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build contracts
        run: forge build --root onchain

      - name: Test contracts
        run: forge test --root onchain --no-match-path 'test/ForkRealManager.t.sol'

      - name: Start a local chain
        run: |
          anvil --port 8545 --silent &
          for _ in $(seq 1 30); do
            cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && break
            sleep 1
          done
          cast block-number --rpc-url http://127.0.0.1:8545

      - name: Migrate
        run: pnpm --filter @aiki/api db:migrate

      - name: Test
        run: pnpm --filter @aiki/api test

      # A chain test that quietly skips looks exactly like one that passed, so the
      # run fails if any did.
      - name: Fail on skipped tests
        run: |
          pnpm --filter @aiki/api test 2>&1 | tee /tmp/out.txt
          if grep -qE '[0-9]+ skipped' /tmp/out.txt; then
            echo "::error::Tests were skipped; a skipped chain test is not a passing one."
            exit 1
          fi

      - name: Build web
        run: pnpm --filter @aiki/web build
