name: CI

# Manual only, for now, and not because that is better.
#
# Every run fails in about three seconds with "The job was not started because
# your account is locked due to a billing issue", and the card that would clear
# it keeps being rejected. On push this produced a permanently red badge on main,
# which this project has already decided once is worse than no CI: a badge that
# is always red is a badge nobody reads, and it hides the run that genuinely
# fails later.
#
# Keep the billing decision separate from workflow maintenance. Restoring push
# or pull_request triggers requires an explicit decision after billing clears.
# A manual run still needs an available GitHub Actions billing account.
on:
  workflow_dispatch:

# A newer manual run on the same ref supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Ephemeral CI service only. Never use a deployment database or signing key.
      DATABASE_URL: postgres://aiki:aiki@127.0.0.1:5432/aiki
      BSC_FORK_RPC: https://bnb-mainnet.g.alchemy.com/public
      BSC_FORK_BLOCK: '121004566'
      NEXT_TELEMETRY_DISABLED: '1'

    services:
      # DATABASE_URL enables the real SQL and concurrency regressions. Apply
      # every migration before tests that expect the shared public schema.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aiki
          POSTGRES_PASSWORD: aiki
          POSTGRES_DB: aiki
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # API deployment/artifact-drift tests load onchain/out from this build.
      # Keep the compiler/EVM settings in foundry.toml unchanged.
      - name: Build contract artifacts
        run: forge build
        working-directory: onchain

      - name: Lint
        run: pnpm lint

      - name: Generate web route types
        run: pnpm --filter @aiki/web exec next typegen

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Apply local database migrations
        run: pnpm --filter @aiki/api db:migrate

      # Both transaction endpoints are loopback Anvil nodes with public test
      # accounts. The remote RPC supplies historical reads only. The fork
      # journey also checks Anvil identity, chain, fork block and test accounts.
      - name: API tests, including local strategy fork journey
        env:
          STRATEGY_JOURNEY_RPC: http://127.0.0.1:18545
          STRATEGY_JOURNEY_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          set -euo pipefail
          anvil --host 127.0.0.1 --port 8545 --chain-id 31337 --silent &
          anvil_pids=("$!")
          trap 'kill "${anvil_pids[@]}" 2>/dev/null || true' EXIT
          anvil --host 127.0.0.1 --port 18545 \
            --fork-url "$BSC_FORK_RPC" --fork-block-number "$BSC_FORK_BLOCK" \
            --chain-id 56 --hardfork cancun --slots-in-an-epoch 1 \
            --gas-price 50000000 --disable-min-priority-fee --block-base-fee-per-gas 50000000 \
            --transaction-block-keeper 10000 --max-persisted-states 10000 --silent &
          anvil_pids+=("$!")
          for attempt in {1..60}; do
            if [ "$(timeout 2s cast chain-id --rpc-url http://127.0.0.1:8545 2>/dev/null)" = '31337' ] &&
               [ "$(timeout 2s cast chain-id --rpc-url "$STRATEGY_JOURNEY_RPC" 2>/dev/null)" = '56' ]; then
              break
            fi
            kill -0 "${anvil_pids[@]}"
            sleep 1
          done
          test "$(timeout 2s cast chain-id --rpc-url http://127.0.0.1:8545)" = '31337'
          test "$(timeout 2s cast chain-id --rpc-url "$STRATEGY_JOURNEY_RPC")" = '56'
          pnpm --filter @aiki/api test

      - name: Web tests
        run: pnpm --filter @aiki/web test

      - name: MCP tests
        run: pnpm --filter @aiki/mcp test

      - name: SDK tests
        run: pnpm --filter @aiki/sdk test

      # Both strategy opt-in variables are set above, so those fork suites run.
      # The legacy real-manager test separately pins block 118000000 and the
      # existing bsc alias in foundry.toml. Public-RPC failures fail this run;
      # they are not converted into passing skips. Forge never broadcasts here.
      - name: Contract tests
        run: forge test
        working-directory: onchain

      - name: Web build
        run: pnpm --filter @aiki/web build
